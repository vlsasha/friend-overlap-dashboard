<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="ogIg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#833ab4"/>
      <stop offset="50%" style="stop-color:#fd1d1d"/>
      <stop offset="100%" style="stop-color:#fcb045"/>
    </linearGradient>
    <linearGradient id="ogLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5"/>
      <stop offset="100%" style="stop-color:#00a0dc"/>
    </linearGradient>
    <linearGradient id="ogOverlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <filter id="ogGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo circles -->
  <circle cx="420" cy="315" r="140" fill="url(#ogIg)" opacity="0.85"/>
  <circle cx="580" cy="315" r="140" fill="url(#ogLi)" opacity="0.85"/>
  <circle cx="500" cy="315" r="60" fill="url(#ogOverlap)" filter="url(#ogGlow)"/>

  <!-- Text -->
  <text x="750" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#f1f5f9" letter-spacing="-0.03em">Friend</text>
  <text x="750" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#ogOverlap)" letter-spacing="-0.03em">Overlap</text>
  <text x="750" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="0.1em">DISCOVER YOUR CROSS-PLATFORM CONNECTIONS</text>

  <!-- Vana badge -->
  <rect x="750" y="450" width="180" height="40" rx="20" fill="none" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <text x="840" y="476" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e94560" text-anchor="middle" letter-spacing="0.15em">POWERED BY VANA</text>
</svg>