<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#833ab4"/>
      <stop offset="50%" style="stop-color:#fd1d1d"/>
      <stop offset="100%" style="stop-color:#fcb045"/>
    </linearGradient>
    <linearGradient id="liGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5"/>
      <stop offset="100%" style="stop-color:#00a0dc"/>
    </linearGradient>
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle for depth -->
  <circle cx="60" cy="60" r="52" fill="#0a0a1a" opacity="0.5"/>

  <!-- Instagram circle -->
  <circle cx="48" cy="60" r="32" fill="url(#igGrad)" opacity="0.9"/>

  <!-- LinkedIn circle -->
  <circle cx="72" cy="60" r="32" fill="url(#liGrad)" opacity="0.9"/>

  <!-- Overlap highlight -->
  <circle cx="60" cy="60" r="14" fill="url(#overlapGrad)" filter="url(#glow)"/>

  <!-- Text: Friend -->
  <text x="115" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9" letter-spacing="-0.02em">Friend</text>

  <!-- Text: Overlap -->
  <text x="115" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="url(#overlapGrad)" letter-spacing="-0.02em">Overlap</text>

  <!-- Small tagline -->
  <text x="115" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="0.08em">POWERED BY VANA</text>
</svg>